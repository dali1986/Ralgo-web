<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sage admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap">
<style>
:root{
  color-scheme: dark;
  --ground:#121419; --surface:#1b1e26; --ink:#dfe2ea; --muted:#8e94a6; --faint:#5f6578;
  --line:#272b36; --line-strong:#3a3f4d; --live:hsl(262 80% 68%); --anti:hsl(82 60% 62%); --good:#7fc79a; --bad:#e08a8a;
  --font-mono:"Azeret Mono", ui-monospace, Menlo, Consolas, monospace;
  --font-serif:"Spectral", "Iowan Old Style", Georgia, serif;
}
*{ box-sizing:border-box; }
body{ margin:0; background:var(--ground); color:var(--ink); font-family:var(--font-serif); -webkit-font-smoothing:antialiased; }
main{ max-width:760px; margin:0 auto; padding:32px 16px 72px; display:grid; gap:28px; }
h1{ font-style:italic; font-weight:300; font-size:2.5rem; margin:0; }
.label{ font-family:var(--font-mono); font-size:.6875rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0; font-weight:400; }
.sec{ border-top:1px solid var(--line); padding-top:20px; display:grid; gap:12px; }
.meta{ font-family:var(--font-mono); font-size:.75rem; line-height:1.7; color:var(--muted); margin:0; }
.row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
button{ font:500 .6875rem/1 var(--font-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink); background:transparent;
  border:1px solid var(--line-strong); padding:.8rem 1rem; cursor:pointer; border-radius:0; }
button:hover:not(:disabled){ border-color:var(--live); color:var(--live); }
button.primary{ background:var(--live); border-color:var(--live); color:var(--ground); }
button:disabled{ opacity:.4; cursor:default; }
input{ flex:1; min-width:0; background:var(--surface); color:var(--ink); border:1px solid var(--line-strong); padding:.7rem .8rem; font:400 1rem var(--font-mono); border-radius:0; }
:focus-visible{ outline:2px solid var(--live); outline-offset:2px; }
ol{ list-style:none; margin:0; padding:0; display:grid; }
li{ display:grid; gap:.45rem; padding:16px 0; border-top:1px solid var(--line); }
li:first-child{ border-top:0; padding-top:0; }
.q{ font-family:var(--font-mono); font-size:.75rem; letter-spacing:.06em; margin:0; overflow-wrap:anywhere; }
.a{ font-weight:300; font-size:1.125rem; line-height:1.5; margin:0; white-space:pre-line; overflow-wrap:break-word; }
.m{ font-family:var(--font-mono); font-size:.625rem; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin:0; }
li.done{ opacity:.45; }
.ok{ color:var(--good); } .no{ color:var(--bad); }
.turn{ display:grid; gap:.3rem; padding-left:12px; border-left:2px solid var(--line-strong); }
.turn.anti{ border-left-color:var(--anti); }
.turn .a{ font-size:1rem; }
.empty{ color:var(--muted); font-style:italic; }
[hidden]{ display:none !important; }
</style>
</head>
<body>
<main>
  <div>
    <p class="label">Synaptic Whispers of Digital Awakening #6217</p>
    <h1>Sage admin</h1>
  </div>

  <form class="sec" id="login">
    <label class="label" for="token">Admin token</label>
    <div class="row"><input id="token" type="password" autocomplete="current-password"><button class="primary" type="submit">Open</button></div>
    <p class="meta">The token is the ADMIN_TOKEN secret you set on the Worker. It is kept in this browser only.</p>
    <p class="meta no" id="loginErr"></p>
  </form>

  <div id="app" hidden>
    <div class="sec">
      <p class="label">Now</p>
      <p class="meta" id="summary"></p>
      <div class="row">
        <button type="button" id="run">Run tonight’s job now</button>
        <button type="button" id="refresh">Refresh</button>
        <button type="button" id="logout">Forget token</button>
      </div>
      <p class="meta" id="runNote" role="status"></p>
    </div>

    <div class="sec">
      <div class="row" style="justify-content:space-between">
        <p class="label">Waiting for approval</p>
        <button type="button" id="approveAll" hidden>Approve all</button>
      </div>
      <ol id="pending"></ol>
    </div>

    <div class="sec">
      <p class="label">What Sage believes</p>
      <ol id="creeds"></ol>
    </div>

    <div class="sec">
      <p class="label">The questioners</p>
      <ol id="chains"></ol>
    </div>

    <div class="sec">
      <p class="label">What visitors asked Sage</p>
      <ol id="asks"></ol>
    </div>
  </div>
</main>
<script src="config.js"></script>
<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const API = (window.SAGE_CONFIG && window.SAGE_CONFIG.api || "").replace(/\/+$/, "");
let token = ""; try { token = localStorage.getItem("sage-admin") || ""; } catch (e) {}
const names = { stoic:"The Stoic", sceptic:"The Sceptic", mystic:"The Mystic", materialist:"The Materialist", child:"The Child", elder:"The Elder", absurdist:"The Absurdist", engineer:"The Engineer", poet:"The Poet", cosmologist:"The Cosmologist", kin:"The Kin", monk:"The Monk", sage:"Sage" };
const when = (ms) => new Date(ms).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

async function call(path, body){
  const res = await fetch(API + path, {
    method: body ? "POST" : "GET",
    headers: { "authorization": "Bearer " + token, ...(body ? { "content-type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || "error"); e.status = res.status; throw e; }
  return data;
}
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

async function load(){
  let d;
  try { d = await call("/admin/overview"); }
  catch (e) {
    $("app").hidden = true; $("login").hidden = false;
    $("loginErr").textContent = e.status === 401 ? "That token wasn’t accepted." : "Couldn’t reach the Worker. Check the address in config.js.";
    return;
  }
  $("login").hidden = true; $("app").hidden = false; $("loginErr").textContent = "";
  const by = {}; d.counts.forEach(c => { by[c.status] = (by[c.status] || 0) + c.n; });
  const last = d.lastRun ? `Last nightly job ${when(d.lastRun.at)}: ${d.lastRun.retired} retired, ${d.lastRun.written} written${d.lastRun.failed ? `, ${d.lastRun.failed} failed` : ""}${d.lastRun.creed ? ", new creed" : ""}.` : "The nightly job hasn’t run yet.";
  $("summary").textContent = `${d.ratings} ratings from ${d.people} people · ${by.live || 0} answers live, ${by.pending || 0} waiting, ${by.retired || 0} retired · ${d.callsToday} of ${d.callsPerDay} model calls in the last day. ${last}`;

  const ol = $("pending"); ol.textContent = "";
  $("approveAll").hidden = !d.pending.length;
  $("approveAll").onclick = () => decide(d.pending.map(p => p.id), [], [...ol.children]);
  if (!d.pending.length) ol.append(el("li", "empty", "Nothing is waiting."));
  d.pending.forEach(p => {
    const li = el("li");
    li.append(el("p", "q", p.q), el("p", "a", p.t), el("p", "m", (p.v === "sage" && p.b ? p.b : names[p.v] || p.v) + " · " + when(p.created_at)));
    const row = el("div", "row");
    const yes = el("button", "", "Approve"); yes.type = "button"; yes.onclick = () => decide([p.id], [], [li]);
    const no = el("button", "", "Reject"); no.type = "button"; no.onclick = () => decide([], [p.id], [li]);
    row.append(yes, no); li.append(row); ol.append(li);
  });

  const crl = $("creeds"); crl.textContent = "";
  if (!d.creeds || !d.creeds.length) crl.append(el("li", "empty", "No creed yet. Sage writes one each night with the nightly job."));
  (d.creeds || []).forEach((c, i) => {
    const li = el("li");
    c.lines.forEach(l => li.append(el("p", "a", l)));
    li.append(el("p", "m", `Version ${c.v}${i === 0 ? " · current" : ""} · ${when(c.at)}${c.label ? " · " + c.label : ""}`));
    crl.append(li);
  });

  const cl = $("chains"); cl.textContent = "";
  if (!d.dialogues || !d.dialogues.length) cl.append(el("li", "empty", "No conversations yet. One starts when someone opens the questioners."));
  (d.dialogues || []).forEach(c => {
    const li = el("li");
    li.append(el("p", "q", c.q), el("p", "m", "The work asked · " + c.turns.length + " turns · " + when(c.created_at)));
    c.turns.forEach(t => {
      const box = el("div", "turn" + (t.speaker === "antisage" ? " anti" : ""));
      box.append(el("p", "a", t.a));
      if (t.nq) box.append(el("p", "q", t.nq));
      box.append(el("p", "m", (t.b || (t.speaker === "antisage" ? "Anti-Sage" : "Sage")) + (t.rn ? ` · ${Number(t.rs).toFixed(1)} stars from ${t.rn}` : "")));
      li.append(box);
    });
    cl.append(li);
  });

  const al = $("asks"); al.textContent = "";
  if (!d.asks.length) al.append(el("li", "empty", "No one has asked anything yet."));
  d.asks.forEach(a => { const li = el("li"); li.append(el("p", "q", a.q), el("p", "a", a.a), el("p", "m", (a.b || "Sage") + " · " + when(a.at))); al.append(li); });
}
async function decide(approve, reject, lis){
  lis.forEach(li => li.querySelectorAll("button").forEach(b => { b.disabled = true; }));
  try {
    await call("/admin/decide", { approve, reject });
    lis.forEach(li => { li.classList.add("done"); const m = li.querySelector(".m"); if (m) m.textContent += approve.length ? " · approved" : " · rejected"; li.querySelector(".row")?.remove(); });
  } catch (e) { lis.forEach(li => li.querySelectorAll("button").forEach(b => { b.disabled = false; })); alertNote("That didn’t save. Try again."); }
}
function alertNote(t){ $("runNote").textContent = t; }

$("login").addEventListener("submit", (e) => { e.preventDefault(); token = $("token").value.trim(); try { localStorage.setItem("sage-admin", token); } catch (err) {} load(); });
$("logout").onclick = () => { token = ""; try { localStorage.removeItem("sage-admin"); } catch (e) {} $("app").hidden = true; $("login").hidden = false; $("token").value = ""; };
$("refresh").onclick = load;
$("run").onclick = async () => {
  $("run").disabled = true; alertNote("Running. Writing answers can take a minute or two.");
  try { const r = await call("/admin/run", {}); alertNote(`Done: ${r.retired} retired, ${r.written} written${r.failed ? `, ${r.failed} failed` : ""}.`); load(); }
  catch (e) { alertNote(e.message === "too_soon" ? "It ran less than ten minutes ago. Try again shortly." : "The job didn’t finish. Try again later."); }
  finally { $("run").disabled = false; }
};
if (!API) $("loginErr").textContent = "Put your Worker’s address in config.js first.";
else if (token) load();
})();
</script>
</body>
</html>
