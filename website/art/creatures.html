void main() {
  vUv = position.xy;
  vCen = aCenter;
  vec3 world = aCenter + aAxisX * position.x + aAxisY * position.y;

  vClip = gl_Position;

  vFill = aFill;

  vFog = 1.0 - exp(-d * uFogDensity);
}

// A regular polygon, which a superellipse cannot be.
//
// The superellipse family runs from a star through a circle to a square, and
// every member of it has four-fold symmetry \u2014 so it can make a rounded square
// and it can never make a hexagon. This is the other family: the boundary of a
// k-gon of circumradius 1 lies at cos(pi/k)/cos(phi), where phi is the angle
// from the nearest edge's normal, so the normalised radius is the point's own
// length scaled by that. It is continuous across atan's seam because a turn is
// exactly k segments, and mod is blind to whole segments.
float polyRadius(vec2 p, float k) {
  float a = atan(p.y, p.x);
  float seg = 6.28318530718 / k;
  float phi = mod(a + seg * 0.5, seg) - seg * 0.5;
  return length(p) * cos(phi) / cos(3.14159265359 / k);
}

// One set of engraved lines across the mark. Below the scale where the lines
// can be told apart it decays to their average tone instead of aliasing.
float engrave(float coord, float freq) {
  float v = coord * freq;
  float d = abs(fract(v) - 0.5) * 2.0;
  float w = max(fwidth(v), 1e-5);
  float line = 1.0 - smoothstep(uHatchW - w, uHatchW + w, d);
  return mix(uHatchDuty, line, clamp(uHatchW / w, 0.0, 1.0));
}

// Hue and chroma moved in OKLab, so a colour can be turned toward warm or cool
// without the lightness sliding with it.
vec3 turnHue(vec3 c, float turns, float chromaMul) {
  vec3 lms = vec3(
    0.4122214708 * c.r + 0.5363325363 * c.g + 0.0514459929 * c.b,
    0.2119034982 * c.r + 0.6806995451 * c.g + 0.1073969566 * c.b,
    0.0883024619 * c.r + 0.2817188376 * c.g + 0.6299787005 * c.b);
  lms = sign(lms) * pow(abs(lms), vec3(0.3333333));
  float L = 0.2104542553 * lms.x + 0.7936177850 * lms.y - 0.0040720468 * lms.z;
  float a = 1.9779984951 * lms.x - 2.4285922050 * lms.y + 0.4505937099 * lms.z;
  float b = 0.0259040371 * lms.x + 0.7827717662 * lms.y - 0.8086757660 * lms.z;
  float t = turns * 6.28318530718;
  float cs = cos(t), sn = sin(t);
  float a2 = (a * cs - b * sn) * chromaMul;
  float b2 = (a * sn + b * cs) * chromaMul;
  vec3 q = vec3(L + 0.3963377774 * a2 + 0.2158037573 * b2,
                L - 0.1055613458 * a2 - 0.0638541728 * b2,
                L - 0.0894841775 * a2 - 1.2914855480 * b2);
  q = q * q * q;
  return vec3(
     4.0767416621 * q.x - 3.3077115913 * q.y + 0.2309699292 * q.z,
    -1.2684380046 * q.x + 2.6097574011 * q.y - 0.3413193965 * q.z,
    -0.0041960863 * q.x - 0.7034186147 * q.y + 1.7076147010 * q.z);
}

void main() {
  // An instance can force itself round. The Mark trait turns every disc into a
  // superellipse \u2014 on a Faceted edition the eyes came out as hatched squares,
  // because an eye is drawn through the same instanced path as the growth. The
  // flag rides in the high part of the hatch channel rather than costing a
  // whole attribute.
  // Two flags ride in the high part of the hatch channel rather than costing
  // attributes: force-round, and exempt-from-occlusion.
  // The band edges are read with half a unit of slack. A code that lands
  // EXACTLY on an edge (a square-globe stamp with no hatch is 1750, and
  // 1750 mod 500 is 250, the edge of the four-sided band) came through the
  // varying interpolation as 249.9999 on one eye and 250.0 on the other \u2014
  // one eye a square and the other a hexagon, on the same head.
  float noOcclude = step(499.5, vShape.z);
  float restZ = mod(vShape.z + 0.5, 500.0) - 0.5;
  float roundFlag = step(49.5, restZ);
  float hatchScale = mod(restZ + 0.5, 50.0) - 0.5;
  // ...and now a third: which SHAPE this instance is. The hatch channel is
  // banded in fifties, of which only the first two were spoken for \u2014 the
  // growth's own superellipse in 0-49 and forced-round in 100-149 \u2014 so a
  // polygon fits in the space above without disturbing either. 200 is a
  // hexagon, 250 a square, and the hatch scale still reads out of the low
  // fifty in every case.
  float sides = restZ >= 249.5 ? 4.0 : (restZ >= 199.5 ? 6.0 : 0.0);
  float r = sides > 0.5 ? polyRadius(vUv, sides)
    : shapeRadius(vUv, mix(uExponent, 2.0, roundFlag));
  float aa = max(fwidth(r), 1e-5);

  float disc = 1.0 - smoothstep(1.0 - aa, 1.0 + aa, r);
  float sw = max(vShape.x, aa * 0.18);
  float inner = max(0.0, 1.0 - sw);
  float edge = smoothstep(1.0 - aa, 1.0 + aa, r);

  // the edge is drawn twice: a dark contour outboard of a lit lip. That pairing
  // is what makes a form read as cut rather than faded.
  float mid = 1.0 - sw * 0.42;
  float band = clamp(smoothstep(inner - aa, inner + aa, r) - edge, 0.0, 1.0);
  float outer = clamp(smoothstep(mid - aa, mid + aa, r) - edge, 0.0, 1.0);
  float lip = clamp(band - outer, 0.0, 1.0);

  float hatch = 1.0;
  if (hatchScale > 0.001) {
    hatch = engrave(vUv.x, uHatchFreq * hatchScale);
    if (uCross > 0.5) hatch = max(hatch, engrave(vUv.y, uHatchFreq * hatchScale * 0.72));
  }
  disc *= hatch;

  float rc = clamp(length(vUv), 0.0, 1.0);
  float hgt = sqrt(max(0.0, 1.0 - rc * rc));
  vec3 n = normalize(vX * vUv.x + vY * vUv.y + vZ * (hgt / max(vShape.y, 0.05)));

  vec2 suv = vClip.xy / vClip.w * 0.5 + 0.5;
  float dNear = texture2D(tDensity, suv).r;
  float dc = log2(1.0 + texture2D(tDensityBlur, suv).r);
  float dens = dNear * 0.45 + texture2D(tDensityBlur, suv).r * 1.55;
  float enc = clamp((log2(1.0 + dens) - uDensLo) / uDensRange, 0.0, 1.0);
  float ao = 1.0 - uAO * enc;

  // Macro relief. The density field is a height map of the whole colony, so its
  // gradient gives a surface normal for the mass itself, and its laplacian says
  // whether a point sits in a crevice or on a ridge.
  float dxl = log2(1.0 + texture2D(tDensityBlur, suv - vec2(uDensTexel.x, 0.0)).r);
  float dxr = log2(1.0 + texture2D(tDensityBlur, suv + vec2(uDensTexel.x, 0.0)).r);
  float dyd = log2(1.0 + texture2D(tDensityBlur, suv - vec2(0.0, uDensTexel.y)).r);
  float dyu = log2(1.0 + texture2D(tDensityBlur, suv + vec2(0.0, uDensTexel.y)).r);
  vec3 nMacro = normalize(vec3(-(dxr - dxl) * uMacroGain, -(dyu - dyd) * uMacroGain, 1.0));
  float lap = (dxl + dxr + dyd + dyu) - 4.0 * dc;
  float cavity = clamp(-lap * uCavGain, -1.0, 1.0);   // +1 ridge, -1 crevice

  // wrapped diffuse \u2014 light bends round the mark instead of terminating hard
  float kdMicro = max((dot(n, uKeyDir) + uWrap) / (1.0 + uWrap), 0.0);
  float kdMacro = max((dot(nMacro, uKeyDir) + uWrap) / (1.0 + uWrap), 0.0);
  float kd = mix(kdMicro, kdMicro * 0.45 + kdMacro * 0.85, uMacroMix);
  kd *= 1.0 + cavity * uCav;
  float fd = max(dot(n, uFillDir), 0.0);

  vec3 hv = normalize(uKeyDir + vView);
  float spec = pow(max(dot(n, hv), 0.0), uSpecPow) * uSpec
             + pow(max(dot(nMacro, hv), 0.0), uSpecPow * 0.35) * uSpec * 0.7;
  spec *= 1.0 - enc * 0.7;

  // light coming through the mark from behind: thin edges glow with their own hue
  float trans = pow(max(dot(-n, uBackDir), 0.0), uTransPow) * uTrans * (1.0 - enc * 0.6);

  float rim = pow(1.0 - clamp(dot(n, vView), 0.0, 1.0), uRimPow);
  rim *= mix(1.0, 0.18, enc);

  // Temperature does the shading. The key is warm and the ambient cool, and the
  // hue itself turns with the light rather than only the value \u2014 plus a slow
  // turn with depth, so far growth cools as it recedes.
  // Portrait modelling. A bilaterally symmetrical mass lit by a per-mark rig is
  // an ornament, not a head: both cheeks get the same light and the thing reads
  // flat and heraldic. A broad falloff across the frame along the key direction
  // is what turns it into a lit portrait \u2014 one side of the face carries the
  // light, the other falls into a cool shadow, and the symmetry survives in the
  // form while breaking in the tone, which is what living faces actually do.
  // The light had been a gentle gradient across the frame, which means every head
  // is lit evenly across its whole width and none of them has a side that falls
  // away. A painted portrait reads at distance because it has a terminator: a
  // place where the form turns out of the light and most of what is beyond it is
  // gone. That is a smoothstep with a position and a hardness, not a dot product.
  vec2 hp = suv * 2.0 - 1.0;
  // The terminator is biased toward vertical, so it separates a lit side from a
  // shadow side. Taken straight from the key it ran mostly horizontal \u2014 and a
  // head whose *bottom* is lost reads as a cropped render, where a head whose
  // *side* is lost reads as light.
  float model = dot(normalize(vec2(uKeyDir.x, uKeyDir.y * 0.3) + 1e-5), hp);
  float lightMask = smoothstep(uTerm - uTermSoft, uTerm + uTermSoft, model);
  float modelLit = mix(uShadowFloor, 1.0 + uModel * 0.55, lightMask);
  float modelCool = (1.0 - lightMask) * uModel;

  vec3 lit = (uAmbient * uCoolCol * (1.0 + modelCool * 1.3)
            + (uKeyCol * kd + uFillCol * fd * 0.55) * uKeyGain * modelLit) * ao;
  vec3 sheen = turnHue(mix(uRimCol, uRimCol2, clamp(rim * 1.5, 0.0, 1.0)), uHueIrid * rim, 1.0);
  // Silhouette: every source of light on the figure is withdrawn except from
  // the eyes. mix(1, k, 0) is exactly 1, so a seed without it is untouched.
  float silK = mix(1.0, 0.05, uSil * (1.0 - step(1550.0, vShape.z)));
  lit *= silK; sheen *= silK; spec *= silK; trans *= silK;

  float turn = uHueWarm * (kd - 0.55) + uHueDepth * (vFog - 0.3);
  float chroma = 1.0 + uChromaLit * (kd - 0.5);

  vec3 fillCol = vFill.rgb * (lit + sheen * rim * uRimGain * 1.6)
               + sheen * spec * 0.4
               + vFill.rgb * uKeyCol * trans * 3.0;
  fillCol = turnHue(fillCol, turn, chroma);

  float aoS = mix(1.0, ao, 0.45);
  vec3 lipCol = vStroke.rgb *
      (uStrokeAmb * aoS + uStrokeLit * aoS * (0.85 * kd + 0.22 * fd + rim * uRimGain * 2.4)) * silK
      + sheen * spec;
  lipCol = turnHue(lipCol, turn * 0.7, chroma);
  vec3 outCol = vFill.rgb * (0.12 + 0.24 * kd) * ao;

  fillCol = mix(fillCol, uFogCol, vFog * uFogMix);
  lipCol = mix(lipCol, uFogCol, vFog * uFogMix * 0.75);
  outCol = mix(outCol, uFogCol, vFog * uFogMix * 0.9);

  float fade = 1.0 - vFog * uFogFade;
  // paper tooth: a fixed grain the marks sit into, so edges break like graphite
  float tooth = mix(1.0, 0.42 + 0.58 * hash21(floor(suv * uToothFreq)), uTooth);

  // ---------------------------------------------------------------- medium
  // Each medium rebuilds the mark from the same ingredients \u2014 radius, tone,
  // key light, density \u2014 and hands back a different disc, a different colour
  // and its own opacity. The eye marks (noOcclude) are spared most of it: an
  // eye in a wash is still a wet dark thing with a point of light in it, and a
  // woodcut eye is cut solid rather than in lines.
  float fAlpha = 1.0;      // multiplier on the fill's alpha
  float emitMul = 1.0;     // multiplier on emission
  float burrOn = uBurr;
  float outlineOn = uOutline;
  // Spared: the eyes entirely, the other stamped features (mouth, crown,
  // eyewear) by half \u2014 they are drawn through the same path as the growth
  // and the medium should reach them, but they must stay crisp enough to read.
  float spare = max(step(1550.0, vShape.z), noOcclude * 0.5);
  // where the FORM is lit, not where this one mark is: a wash or a charcoal
  // tone is laid over a passage of the head, so it follows the macro normal
  float litForm = clamp(mix(kd, kdMacro, 0.65) * modelLit, 0.0, 1.0);
  if (uMedium > 0.5) {
    float ph = hash21(vCen.xy * 0.0137 + vCen.z * 0.0071) * 6.2832;
    float ang = atan(vUv.y, vUv.x);
    float y = dot(vFill.rgb, vec3(0.2126, 0.7152, 0.0722));
    float rc2 = clamp(length(vUv), 0.0, 1.5);
    lip = 0.0; outer = 0.0; burrOn = 0.0; outlineOn = 0.0;
    if (uMedium < 1.5) {
      // INK WASH. The edge of a wash is not a line: it is where the water
      // stopped, and it wanders. The pigment gathers at the drying edge and
      // the interior granulates on the paper's tooth. Nothing is lit \u2014 the
      // tone is the tone of the ink, thinned.
      float wob = 1.0 + 0.09 * sin(ang * 3.0 + ph) + 0.05 * sin(ang * 7.0 - ph * 2.0);
      float rw = rc2 / wob;
      float soft = mix(0.42, 0.12, spare);
      float wash = 1.0 - smoothstep(1.0 - soft, 1.0 + aa, rw);
      float pool = smoothstep(1.0 - soft, 1.0 - soft * 0.3, rw) * (1.0 - smoothstep(1.0 - soft * 0.3, 1.0 + aa, rw));
      float gran = 0.9 + 0.1 * hash21(floor(suv * uToothFreq * 0.3) + 3.7);
      disc = wash * gran * (1.0 + 0.9 * pool);
      // Dilution. Most washes are thin \u2014 the sheet shows through \u2014 and a few
      // are loaded; the darkness of a mark is how much ink was in the brush
      // when it was laid, not how the form is lit. The lit side gets thinner
      // washes on average, which is the only modelling a wash does.
      float load = hash21(vCen.xy * 0.0091 + 1.7);
      float darkW = clamp(0.05 + 0.8 * (1.0 - litForm) + (load - 0.5) * 0.7, 0.0, 1.0);
      vec3 thin = mix(vec3(1.0), uMedCol, 0.68);
      vec3 ink = mix(thin, uMedCol * 0.6, darkW);
      fillCol = mix(ink, vFill.rgb * (0.5 + 0.5 * kd) * 2.0, spare * 0.7) * ao;
      fAlpha = mix(0.8 + 1.6 * darkW, 1.0, spare);
      emitMul = spare;
    } else if (uMedium < 2.5) {
      // CHARCOAL. A stick dragged across a toothed sheet leaves its black
      // where the grain stands up and skips where it dips; the edge is a
      // smudge rather than a line. Warm in the lights \u2014 sanguine \u2014 where the
      // key falls.
      float g1 = hash21(floor(suv * uToothFreq * 1.6) + 1.3);
      float g2 = hash21(floor(suv * uToothFreq * 0.5) + 2.9);
      float grain = mix(g1, g2, 0.45);
      float core = 1.0 - smoothstep(mix(0.55, 0.9, spare), 1.0 + aa, rc2);
      float smudge = exp(-max(rc2 - 0.85, 0.0) * 3.2) * 0.5 * (1.0 - smoothstep(1.15, 1.4, rc2));
      // Pressure. In the light the stick barely touches and only the tops of
      // the grain take any black; in the shadow it is leaned on and the sheet
      // fills. Tone in a charcoal drawing IS coverage.
      float lit = litForm;
      float press = mix(0.95, 0.25, lit) * (0.7 + 0.3 * hash21(vCen.xy * 0.0083 + 0.4));
      float bite = smoothstep(0.35, 0.8, core * press + 0.35 - grain * mix(0.9, 0.25, spare));
      disc = max(bite, smudge * press * (0.4 + 0.6 * grain));
      float warm = smoothstep(0.45, 1.0, lit) * 0.8 * (1.0 - spare);
      vec3 ch = mix(uMedCol2, uMedCol, warm);
      fillCol = mix(ch, vFill.rgb * (0.4 + 0.6 * kd) * 2.0, spare * 0.8) * ao;
      fAlpha = mix(0.45 + 0.55 * press, 1.0, spare);
      emitMul = spare;
    } else if (uMedium < 3.5) {
      // IMPASTO. Paint with a body: bristle ridges run along the stroke and
      // catch the key as a broken highlight; the thick edge throws a shadow
      // on its far side and takes the light on its near side. Opaque, hard,
      // and nothing glows but the eyes.
      float rid = sin(vUv.y * uMedFreq + ph * 3.0 + vUv.x * 1.7);
      float dRid = cos(vUv.y * uMedFreq + ph * 3.0 + vUv.x * 1.7) * uMedFreq;
      vec3 n2 = normalize(n + vY * dRid * 0.035 * (1.0 - rc2 * rc2 * 0.5) * (1.0 - spare));
      float kd2 = max((dot(n2, uKeyDir) + uWrap) / (1.0 + uWrap), 0.0);
      float sp2 = pow(max(dot(n2, hv), 0.0), 18.0) * (0.55 + 0.45 * hash21(vCen.xy * 0.021));
      vec2 kxy = normalize(uKeyDir.xy + vec2(1e-4));
      float toKey = dot(normalize(vUv + vec2(1e-4)), kxy);
      float edgeBand = smoothstep(0.7, 0.92, rc2) * (1.0 - edge);
      float ridgeLight = edgeBand * toKey * (1.0 - spare);
      disc = 1.0 - smoothstep(1.0 - aa, 1.0 + aa, r);
      vec3 body = vFill.rgb * (uAmbient * uCoolCol * 3.0 + (uKeyCol * kd2 * 1.7 + uFillCol * fd * 0.5) * uKeyGain * modelLit) * ao;
      body += uKeyCol * sp2 * 0.8 * modelLit;
      // paint keeps its own colour in the shadow \u2014 a tube colour has a body
      // that filigree does not, so the lost side is dim, never black
      body += vFill.rgb * 0.34 * ao * (0.6 + 0.4 * modelLit);
      body *= 1.0 + 0.9 * max(ridgeLight, 0.0) + 0.75 * min(ridgeLight, 0.0);
      body += uKeyCol * max(ridgeLight, 0.0) * 0.25;
      body += rid * 0.04 * vFill.rgb * (1.0 - spare);
      // paint straight from the tube: more chroma than the lit filigree carries
      body = mix(vec3(dot(body, vec3(0.2126, 0.7152, 0.0722))), body, 1.4);
      fillCol = mix(body, fillCol, spare);
      fAlpha = mix(3.0, 1.0, spare);
      emitMul = mix(0.15, 1.0, spare);
    } else if (uMedium < 4.5) {
      // WOODCUT. There is no tone in a woodcut, only where the knife went.
      // The interior is cut into lines that widen into solid black as the
      // form turns from the light, so the shading is the width of the cut
      // and nothing else. One spot ink, printed off a second block, for the
      // marks the palette had saturated. The paper shows through the cuts.
      float lit = litForm;
      float lw = mix(0.95, 0.24, lit) * (1.0 - 0.3 * rc2 * rc2);
      // The cuts are made in the SHEET, not in the mark: one set of parallel
      // lines across the whole block, so a thousand overlapping marks share
      // the same open channels instead of each filling the last one's.
      vec2 cdir = vec2(cos(uMedSeed * 0.11 + 0.9), sin(uMedSeed * 0.11 + 0.9));
      float v = dot(suv, cdir) * uMedFreq * 30.0 + 0.15 * sin(dot(suv, cdir.yx) * 40.0 + uMedSeed);
      float dd = abs(fract(v) - 0.5) * 2.0;
      float w = max(fwidth(v), 1e-5);
      float cut = 1.0 - smoothstep(lw - w, lw + w, dd);
      float hard = 1.0 - smoothstep(1.0 - aa, 1.0 + aa, r);
      disc = hard * mix(cut, 1.0, spare);
      float chroma = max(max(vFill.r, vFill.g), vFill.b) - min(min(vFill.r, vFill.g), vFill.b);
      float spot = smoothstep(0.035, 0.09, chroma) * (1.0 - spare);
      fillCol = mix(uMedCol2, uMedCol, spot);
      fillCol = mix(fillCol, vFill.rgb * (0.5 + 0.5 * kd), spare * 0.85);
      fAlpha = mix(3.0, 1.0, spare);
      emitMul = spare;
    } else {
      // GOLD LEAF. Laid in squares, each a slightly different gold, the seams
      // between them showing as fine dark lines; burnished, so the light on it
      // is a hot, narrow reflection rather than a diffuse glow. Its shadow is
      // the red bole the leaf was laid over. The eyes are enamel and keep
      // their own colour.
      vec2 cu = (suv + vec2(0.012 * sin(suv.y * 5.0 + uMedSeed), 0.0)) * vec2(15.0, 15.0) + vec2(uMedSeed);
      vec2 ci = floor(cu), cf = fract(cu);
      float cellV = hash21(ci + 2.1);
      float seamD = min(min(cf.x, cf.y), min(1.0 - cf.x, 1.0 - cf.y));
      float seam = 1.0 - smoothstep(0.0, 0.025, seamD);
      float tone = clamp(y * 1.5, 0.0, 1.0);
      vec3 gold = mix(uMedCol2, uMedCol, tone) * (0.72 + 0.5 * cellV);
      float sp1 = pow(max(dot(n, hv), 0.0), 7.0) * 0.55 + pow(max(dot(n, hv), 0.0), 38.0) * 1.1;
      sp1 *= 0.6 + 0.8 * cellV;
      disc = 1.0 - smoothstep(1.0 - aa, 1.0 + aa, r);
      vec3 leaf = gold * (0.16 + 0.84 * kd) * modelLit * ao + gold * sp1 * 1.3 * modelLit + gold * rim * 0.45;
      leaf *= 1.0 - seam * 0.4;
      fillCol = mix(leaf, fillCol, spare);
      lipCol = mix(gold * (0.8 + 0.8 * kd + sp1) * modelLit, lipCol, spare);
      lip = clamp(band, 0.0, 1.0) * 0.6;
      fAlpha = mix(1.9, 1.0, spare);
      emitMul = mix(0.3, 1.0, spare);
    }
  }
  // The sheet. Laid paper carries the parallel chain lines of the mould, which
  // the ink sits into and which read faintly across the whole print; vellum and
  // plate are progressively smoother, so the marks float rather than bite.
  if (uSubstrate < 1.5) {
    if (uSubstrate > 0.5) {
      float laid = 0.5 + 0.5 * sin(suv.y * 620.0);
      float chain = 0.5 + 0.5 * sin(suv.x * 26.0);
      tooth *= 1.0 - 0.16 * laid - 0.07 * chain;
    }
  } else {
    tooth = mix(1.0, tooth, uSubstrate > 2.5 ? 0.18 : 0.45);
  }
  float toothEdge = mix(1.0, 0.75 + 0.25 * tooth, 0.5);   // lines keep their bite

  vec4 f = vec4(fillCol, 1.0) * (min(0.96, vFill.a * fAlpha) * disc * fade * tooth);
  vec4 s = vec4(lipCol, 1.0) * (vStroke.a * lip * fade * toothEdge);
  // Drypoint burr: the raised metal beside a scratched line holds ink and prints
  // as a soft dark halo down one side of it. Nothing else in intaglio looks like
  // it, and it costs one extra band.
  float burrBand = 0.0;
  if (burrOn > 0.001) {
    float mid2 = 1.0 - sw * 2.6;
    burrBand = clamp(smoothstep(mid2 - aa, mid2 + aa, r) - smoothstep(mid - aa, mid + aa, r), 0.0, 1.0);
    burrBand *= 0.5 + 0.5 * max(0.0, -dot(normalize(vec3(vUv, 0.001)), uKeyDir));
  }
  vec4 o = vec4(outCol, 1.0) * (vStroke.a * outlineOn * outer * fade * toothEdge)

        // look: Horizon brightens above uHorizonY, and uHorizonY sits at a
        // quarter to two fifths, which is a sky over a low horizon. A field that
        // is a PLACE has an up and a down and gets them backwards silently \u2014 a
        // strike under the creature and a canopy on the floor both read as
        // merely odd rather than as inverted, which is why guessing at it twice
        // was not enough and the triangle had to be read.
        float yy = uv.y;
        vec3 hot = uFieldCol * 16.0 + vec3(0.30, 0.32, 0.38);
        float lit = 0.0, air = 0.0;
        for (int i = 0; i < 3; i++) {
          float sd = uSeed * 0.37 + float(i) * 41.7;
          // Thrown outward on purpose. A bolt down the middle is hidden by the
          // head almost every seed, and the two upper corners are the part of
          // this composition that has never had anything in it.
          float ox = (hash(vec2(sd, 5.0)) > 0.5 ? 1.0 : -1.0)
            * (0.26 + hash(vec2(sd, 3.0)) * 0.42);
          float jag = (fbm(vec2(yy * 6.0 + sd, sd), 4) - 0.5) * 0.40
                    + (fbm(vec2(yy * 23.0 + sd, 2.0), 3) - 0.5) * 0.075;
          float d = abs(gp.x - ox - jag);
          // Struck from the top, dying well above the floor. The first version
          // let the bolts run the whole height and they came out BELOW the
          // creature, which reads as something the creature is emitting. A
          // strike belongs in the sky, where it also fills the two corners this
          // composition has never had anything to put in.
          float lo = hash(vec2(sd, 9.0)) * 0.16;
          float span = smoothstep(0.30 + lo, 0.54 + lo, yy);
          lit = max(lit, (1.0 - smoothstep(0.0, 0.0035, d)) * span);
          air = max(air, pow(1.0 - smoothstep(0.0, 0.085, d), 2.8) * span);
          float by = 0.62 + hash(vec2(sd, 13.0)) * 0.24;
          float t2 = clamp((by - yy) / 0.26, 0.0, 1.0);
          float dir = hash(vec2(sd, 17.0)) > 0.5 ? 1.0 : -1.0;
          float d2 = abs(gp.x - ox - jag - dir * t2 * 0.26);
          float sp2 = step(yy, by) * smoothstep(0.0, 0.06, t2) * (1.0 - t2 * 0.25) * span;
          lit = max(lit, (1.0 - smoothstep(0.0, 0.0026, d2)) * sp2);
          air = max(air, pow(1.0 - smoothstep(0.0, 0.06, d2), 2.8) * sp2);
        }
        // AND IT FLASHES. Every seven to thirteen seconds the sky whites for a
        // third of a second, the bolts flare, and a fainter echo follows a
        // tenth later \u2014 the double-strike every real flash has. step(uTime)
        // kills the whole term at rest, so a still holds only the etched bolt.
        float fper = uFper;
        float fu = mod(uTime + fper * 0.5, fper);
        float fl = step(0.001, uTime)
          * (exp(-fu / 0.16) + 0.55 * exp(-max(fu - 0.12, 0.0) / 0.13));
        col += hot * (lit * 1.5 + air * 0.34) * uFieldAmt * (1.0 + fl * 2.6);
        col += (uFieldCol * 4.0 + vec3(0.10, 0.11, 0.14))
          * fl * smoothstep(0.25, 0.9, yy) * uFieldAmt;
        col = max(col, vec3(0.0));
      } else if (uField < 13.5) {
        // Circuit. A trace enters each cell from one edge, turns at the middle
        // and leaves by another \u2014 that corner is the whole thing, because a grid
        // of straight lines is graph paper and a board is a board because the
        // routing turns. Pads on a minority of junctions, and the plate itself
        // darkened under all of it so the traces have a surface to be etched on.
        vec2 q = gp * 9.5 + uSeed * 0.11;
        vec2 cell = floor(q), fq = fract(q);
        float h1 = hash(cell + 0.5);
        float h2 = hash(cell + 7.3);
        vec2 c0 = vec2(0.5);
        vec2 e1 = h1 < 0.5 ? vec2(0.0, 0.5) : vec2(0.5, 0.0);
        vec2 e2 = h2 < 0.34 ? vec2(1.0, 0.5)
                : h2 < 0.67 ? vec2(0.5, 1.0)
                : (h1 < 0.5 ? vec2(1.0, 0.5) : vec2(0.5, 1.0));
        float d = min(seg(fq, e1, c0), seg(fq, c0, e2));
        float trace = 1.0 - smoothstep(0.016, 0.032, d);
        float rr2 = length(fq - c0);
        float pad = step(0.72, h2)
          * (1.0 - smoothstep(0.085, 0.100, rr2)) * smoothstep(0.038, 0.052, rr2);
        col = mix(col, gbase * 0.55, 0.45 * uFieldAmt);
        vec3 wire = uFieldCol * 10.0 + uFieldCol2 * 7.0 + vec3(0.05);
        // the pads fire, slowly, each on its own rate and phase \u2014 written as
        // sin(t\xB7w + p) \u2212 sin(p) so a still, where t is zero, is exact
        float nph = hash(cell + 4.4) * 6.283;
        float npulse = sin(uTime * (0.8 + hash(cell + 9.1) * 0.8) + nph) - sin(nph);
        col += wire * (trace * (0.55 + 0.09 * npulse) + pad * (1.5 + 0.9 * npulse))
          * (0.45 + 0.55 * hash(cell + 3.1)) * uFieldAmt;
        col = max(col, vec3(0.0));
      } else if (uField < 14.5) {
        // Digital: a field of small lights, most of them dark.
        //
        // The first pass drew filled squares and it came out as a checkerboard \u2014
        // a TILING, which is the one thing this must not be, because a tiling
        // sits in front of the picture as pattern while lights sit behind it as
        // space. Three changes and it stopped being wallpaper: the cell is much
        // smaller, so no single unit competes with a feature on the head; each
        // lit cell is a hot core inside a soft falloff rather than a flat block,
        // which is what a small light at a distance actually looks like; and
        // only a third of them are lit at all, gated further by a slow noise so
        // whole districts go dark.
        vec2 q = vec2(uv.x * uAspect, uv.y) * 24.0 + fract(uSeed * 0.017) * 7.0
          + vec2(0.0, uTime * 0.06);
        vec2 cell = floor(q), fq = fract(q);
        // Small integer arguments, and small ones only. The hash squares its
        // input, so feeding it a large cell index plus a large seed drives it
        // into a range where its own aliasing is visible \u2014 which printed as a
        // regular checkerboard of lit and unlit cells, the one artefact that
        // makes a field of lights read as wallpaper.
        // the lights keep hours too: each cell reseeds on its own 11-29s
        // clock; floor(0/x) = 0 keeps the still exact
        float dEp = floor(uTime / (8.0 + 14.0 * hash(cell * 0.71 + 2.2)));
        float h1 = hash(cell * 0.113 + 1.7 + dEp * 0.29);
        float h2 = hash(cell * 0.079 + 9.1);
        float rr3 = length(fq - vec2(0.5));
        float lamp = pow(1.0 - smoothstep(0.06, 0.46, rr3), 2.2)
          + (1.0 - smoothstep(0.0, 0.09, rr3)) * 0.9;
        float bri = step(0.66, h1) * lamp * (0.20 + 0.80 * h2 * h2)
          * (0.15 + 1.05 * fbm(vec2(uv.x * 2.4, uv.y * 2.4) + uSeed, 3));
        vec3 c1 = uFieldCol * 22.0, c2 = uFieldCol2 * 30.0;
        col += mix(c1, c2, h2) * bri * uFieldAmt * 1.15;
        // the haze the whole field throws, which is what puts them in air
        col += (c1 + c2) * 0.06
          * fbm(vec2(uv.x * 4.0, uv.y * 4.0) + uSeed * 0.5, 3) * uFieldAmt;
        col = max(col, vec3(0.0));
      } else if (uField < 15.5) {
        // Forest \u2014 an OVERGROWTH, which is a different thing from a wood.
        //
        // Two earlier cuts failed in the same direction and it is worth naming.
        // The first darkened the ground to draw the trunks and was invisible,
        // because a fraction of a near-black ground is that same ground; the fix
        // was to put the light BEHIND and let the trunks be what stands in the
        // way. The second was legible and read as a barcode, because a rank of
        // parallel vertical bars is a fence however much you wobble it. What a
        // wood actually has, and a fence does not, is: things at three different
        // distances, trunks that TAPER and BRANCH, and a floor of tangle. These
        // creatures are grown out of knotted filigree; the place they come from
        // has to be made of the same stuff.
        float yy = uv.y;                     // 1 at the top of the sheet
        // The light first, as sky. Everything after it occludes it, which is the
        // right order and also the reason the ranks read as depth rather than as
        // three sets of stripes: a near trunk cuts the haze that a far one is
        // already standing in.
        float leaf = fbm(vec2(uv.x * uAspect * 6.0, uv.y * 8.0) + uSeed, 4);
        float fine = fbm(vec2(uv.x * uAspect * 17.0, uv.y * 21.0) + uSeed * 1.7, 3);
        float canopy = smoothstep(0.44, 1.0, yy)
          * (smoothstep(0.60, 0.30, leaf) * 0.75 + smoothstep(0.62, 0.34, fine) * 0.35);
        canopy = clamp(canopy, 0.0, 1.0);
        vec3 sky = uFieldCol * 6.5 + uFieldCol2 * 4.0;
        float air = (0.22 + 0.78 * smoothstep(0.0, 0.66, yy)) * (1.0 - canopy * 0.88)
          * (0.45 + 0.75 * fbm(vec2(uv.x * uAspect * 2.2, uv.y * 2.0) + uSeed * 0.3, 3));
        col += sky * air * uFieldAmt;
        // the floor mist, laid before the trunks so they stand in it
        col += (uFieldCol2 * 2.2 + uFieldCol * 1.2)
          * pow(1.0 - smoothstep(0.0, 0.32, yy), 1.6) * uFieldAmt;

        // Three ranks, composited far to near. Aerial perspective does the work
        // that no amount of drawing can: a far trunk is not a smaller near one,
        // it is a PALER one, because there is air in front of it.
        for (int i = 2; i >= 0; i--) {
          float fi = float(i);
          float freq = i == 0 ? 3.9 : (i == 1 ? 7.1 : 12.3);
          float xq = uv.x * uAspect * freq + uSeed * 0.3 + fi * 13.0;
          float cx3 = floor(xq), fx = fract(xq);
          float base = (i == 0 ? 0.085 : (i == 1 ? 0.050 : 0.030));
          float hw2 = base + pow(hash(vec2(cx3, fi)), 1.6) * (i == 0 ? 0.20 : 0.13);
          float off = (hash(vec2(cx3, fi + 3.0)) - 0.5) * 0.5;
          float wob = (fbm(vec2(yy * 3.0 + cx3, fi), 3) - 0.5) * 0.16
            + (hash(vec2(cx3, fi + 21.0)) - 0.5) * 0.55 * (yy - 0.5);
          float axis = 0.5 + off + wob;
          // A trunk tapers. A cylinder is a pipe; a tree is a cone with the
          // point cut off, and the taper is most of why the eye reads "tree"
          // before it has read anything else about the shape.
          float tw = hw2 * (1.0 - 0.46 * clamp(yy, 0.0, 1.0));
          float m = 1.0 - smoothstep(tw, tw + 0.026, abs(fx - axis));
          // ...and it branches, once, at a height of its own. One fork is
          // enough: it breaks the vertical, which is the entire complaint.
          float by2 = 0.40 + hash(vec2(cx3, fi + 31.0)) * 0.28;
          float dirb = hash(vec2(cx3, fi + 33.0)) > 0.5 ? 1.0 : -1.0;
          float tb = clamp((yy - by2) / 0.34, 0.0, 1.0);
          float bx = axis + dirb * tb * 0.30;
          float bw = tw * (0.62 - 0.42 * tb);
          float br = (1.0 - smoothstep(bw, bw + 0.020, abs(fx - bx)))
            * step(by2, yy) * (1.0 - smoothstep(0.86, 1.0, tb));
          m = max(m, br);
          // the crown height varies per tree, so the tops do not line up
          float top = 0.70 + hash(vec2(cx3, fi + 8.0)) * 0.26;
          m *= 1.0 - smoothstep(top - 0.12, top + 0.06, yy);
          // A trunk is a CYLINDER, and a flat mask is a plank. Two things make
          // it turn: it takes less of the sky on the side the key comes from,
          // which reads as a lit edge, and its cover is broken along its length
          // by bark. Neither is a highlight painted on \u2014 both work by letting
          // more of what is behind come through, which is the only kind of
          // modelling available to a mask.
          float across = clamp((fx - axis) / max(tw, 1e-4), -1.0, 1.0);
          float lightSide = uKeyXY.x >= 0.0 ? 1.0 : -1.0;
          float lam = clamp(0.5 - across * lightSide * 0.5, 0.0, 1.0);
          float bark = clamp(0.78 + 0.46 * fbm(vec2(fx * 20.0 + cx3 * 3.0, yy * 4.5), 3),
            0.5, 1.15);
          float occl = m * (1.0 - 0.42 * pow(lam, 2.5)) * bark;
          // haze: the far ranks are lifted most of the way to the sky
          float haze = fi * 0.36;
          vec3 tcol = mix(gbase * 0.22, col + sky * 0.16 * uFieldAmt, haze);
          col = mix(col, tcol, clamp(occl, 0.0, 1.0) * (0.92 - fi * 0.12) * uFieldAmt);
        }

        // And the floor: a tangle rather than a lawn. High frequency, ridged,
        // and only along the bottom \u2014 it is the one part of this that is made of
        // the same knotted filigree as the creature standing in front of it.
        float ug = fbm(vec2(uv.x * uAspect * 8.0, yy * 13.0) + uSeed * 0.7, 4);
        float ug2 = fbm(vec2(uv.x * uAspect * 21.0, yy * 27.0) + uSeed * 2.3, 3);
        float ugm = smoothstep(0.40, 0.02, yy)
          * clamp(smoothstep(0.44, 0.64, ug) + smoothstep(0.50, 0.68, ug2) * 0.7, 0.0, 1.0);
        col = mix(col, gbase * 0.18, ugm * uFieldAmt);
        col = max(col, vec3(0.0));
      } else if (uField < 16.5) {
        // Ruins. The same backlit construction as Forest and deliberately its
        // opposite in every line: a wood is made of tapering things that lean,
        // and a ruin is made of STRAIGHT ones that stop. What says concrete is
        // the pair of vertical edges and the flat top broken off at a height \u2014
        // a slab does not taper, it fractures, and the fracture is horizontal
        // because that is where the floor was. The creeper over it is what
        // makes it a ruin rather than a building.
        float yy = uv.y;
        vec3 sky = uFieldCol * 6.0 + uFieldCol2 * 4.0;
        float haze = fbm(vec2(uv.x * uAspect * 2.0, uv.y * 2.0) + uSeed * 0.4, 3);
        col += sky * (0.22 + 0.78 * smoothstep(0.0, 0.72, yy))
          * (0.55 + 0.7 * haze) * uFieldAmt;
        for (int i = 2; i >= 0; i--) {
          float fi = float(i);
          float xq = uv.x * uAspect * (i == 0 ? 1.9 : (i == 1 ? 3.2 : 5.3))
            + uSeed * 0.4 + fi * 11.0;
          float cx3 = floor(xq), fx = fract(xq);
          float hw2 = 0.20 + hash(vec2(cx3, fi)) * 0.26;
          float off = (hash(vec2(cx3, fi + 3.0)) - 0.5) * 0.34;
          // the break: a hard horizontal at a height of its own, roughened just
          // enough that it reads as fractured and not as sawn
          float top = (i == 0 ? 0.26 : (i == 1 ? 0.42 : 0.56))
            + hash(vec2(cx3, fi + 7.0)) * 0.30;
          float rough = (fbm(vec2(fx * 7.0 + cx3 * 3.0, 1.7), 3) - 0.5) * 0.09;
          float side = 1.0 - smoothstep(hw2, hw2 + 0.010, abs(fx - 0.5 - off));
          float m = side * (1.0 - smoothstep(top + rough - 0.004,
            top + rough + 0.004, yy));
          // window voids, on the nearest two ranks only \u2014 a grid of holes is
          // what turns a block into a building, and at the back it is noise
          float win = 0.0;
          if (i < 2) {
            vec2 wq = vec2((fx - 0.5 - off) / max(hw2, 1e-3) * 1.6, yy * 6.5);
            vec2 wc = floor(wq), wf = fract(wq);
            win = step(0.34, hash(wc * 0.31 + cx3 * 0.17 + fi))
              * (1.0 - smoothstep(0.26, 0.34, abs(wf.x - 0.5)))
              * (1.0 - smoothstep(0.28, 0.36, abs(wf.y - 0.5)));
          }
          float pit = fbm(vec2(uv.x * uAspect * 24.0 + cx3, yy * 20.0), 3);
          vec3 tcol = mix(gbase * 0.34, col + sky * 0.13 * uFieldAmt, fi * 0.34);
          tcol *= 0.78 + 0.44 * pit;
          col = mix(col, tcol, clamp(m * (1.0 - win * 0.85), 0.0, 1.0)
            * (0.94 - fi * 0.12) * uFieldAmt);
        }
        // and the thing that makes it a ruin: growth taking it back, heaviest at
        // the foot and reaching up the faces in patches
        float cr = fbm(vec2(uv.x * uAspect * 9.0, yy * 8.0) + uSeed * 0.9, 4);
        float cr2 = fbm(vec2(uv.x * uAspect * 22.0, yy * 19.0) + uSeed * 2.7, 3);
        float creep = clamp(smoothstep(0.44, 0.66, cr) * (1.0 - smoothstep(0.02, 0.62, yy))
          + smoothstep(0.56, 0.74, cr2) * (1.0 - smoothstep(0.0, 0.34, yy)) * 0.8,
          0.0, 1.0);
        col = mix(col, gbase * 0.20, creep * 0.92 * uFieldAmt);
        // A mass that only darkens is the additive-over-near-black lesson in
        // its mirror image: on a dark ground there is nothing left to take
        // away. The creeper keeps a lit fringe along its own boundary, which is
        // where a leaf edge catches the light anyway, so it reads on either.
        col += sky * 0.30 * clamp(creep * (1.0 - creep) * 4.0, 0.0, 1.0) * uFieldAmt;
        col = max(col, vec3(0.0));
      } else if (uField < 17.5) {
        // Greenhouse, gone feral. The glass is the whole idea: a regular ruled
        // grid is the only man-made thing in this piece's vocabulary, and what
        // makes it read as GLASS rather than as a window is that the tangle
        // behind it is soft and low in contrast while the bars are hard \u2014 a
        // sharp grid over a blurred mass is the signature of looking through
        // something. The transoms space by a power of height so the roof runs
        // away from you, and the raking bars above the ridge are the pitch.
        float yy = uv.y;
        vec3 sky = uFieldCol * 7.0 + uFieldCol2 * 5.0;
        float grime = fbm(vec2(uv.x * uAspect * 3.0, uv.y * 3.0) + uSeed, 4);
        col += sky * (0.30 + 0.70 * smoothstep(0.0, 0.85, yy))
          * (0.5 + 0.7 * grime) * uFieldAmt;
        // the planting, pressed against the inside of the glass
        float veg = fbm(vec2(uv.x * uAspect * 6.5, yy * 5.5) + uSeed * 1.3, 5);
        float veg2 = fbm(vec2(uv.x * uAspect * 14.0, yy * 12.0) + uSeed * 2.1, 4);
        float leaf = clamp(smoothstep(0.46, 0.70, veg) * 0.8
          + smoothstep(0.54, 0.74, veg2) * 0.55, 0.0, 1.0);
        // ...and actual LEAVES pressed on the inside of the glass. Noise alone
        // is a stain; a blade with a length and a direction is a plant, and a
        // few dozen of them at the bottom of the pane are what a neglected
        // glasshouse looks like from outside.
        vec2 lq = vec2(uv.x * uAspect, yy) * 17.0 + uSeed * 0.21;
        vec2 lc = floor(lq), lf = fract(lq) - 0.5;
        float la = hash(lc + 1.1) * 6.2831;
        vec2 lp = vec2(lf.x * cos(la) - lf.y * sin(la), lf.x * sin(la) + lf.y * cos(la));
        lp.x /= (0.10 + hash(lc + 2.2) * 0.11);
        lp.y /= (0.26 + hash(lc + 3.3) * 0.20);
        float blade = (1.0 - smoothstep(0.72, 1.0, length(lp)))
          * step(0.46, hash(lc + 4.4));
        leaf = clamp(leaf + blade * 0.9, 0.0, 1.0);
        // pressed hardest against the bottom of the glass, which is where a
        // plant that has been left to itself for a decade actually ends up
        leaf *= 0.16 + 1.15 * pow(1.0 - smoothstep(0.0, 0.85, yy), 1.4);
        col = mix(col, gbase * 0.34, leaf * 0.78 * uFieldAmt);
        // the glazing
        float ridge = 0.78;
        float vx = uv.x * uAspect * 6.0 + 0.5 + uSeed * 0.05;
        float mv = 1.0 - smoothstep(0.026, 0.048, abs(fract(vx) - 0.5));
        float hyq = pow(max(1.0 - yy, 0.001), 0.72) * 8.0;
        float mh = 1.0 - smoothstep(0.030, 0.055, abs(fract(hyq) - 0.5));
        float bars = max(mv, mh);
        if (yy > ridge) {
          float t2 = (yy - ridge) / (1.0 - ridge);
          float sgx = uv.x < 0.5 ? -1.0 : 1.0;
          bars = 1.0 - smoothstep(0.026, 0.048,
            abs(fract(vx + sgx * t2 * 2.6) - 0.5));
        }
        bars = max(bars, 1.0 - smoothstep(0.005, 0.012, abs(yy - ridge)));
        // EVERY PANE IS A SEPARATE PIECE OF GLASS, and until each one had its
        // own dirt the whole wall read as one sheet with a grid drawn on it.
        // A continuous noise across the frame is a smear; a value per cell is
        // glazing. Some panes are filthy, some are nearly clean, and about one
        // in nine is gone altogether \u2014 which is the single detail that turns a
        // glasshouse into a derelict one.
        vec2 pane = vec2(floor(vx), floor(hyq));
        float pg = hash(pane * 0.37 + 1.9);
        float gone = step(0.915, hash(pane * 0.53 + 4.1));
        float paneIn = (1.0 - bars);
        // Per-pane dirt, but a NARROW range. At full contrast the wall came out
        // as a patchwork of light and dark blocks \u2014 which is a quilt, not
        // glazing. Panes differ; they do not differ by a factor of five.
        col += sky * (0.14 + 0.30 * pg) * paneIn * (1.0 - gone * 0.8) * uFieldAmt;
        // A missing pane is an ABSENCE of glass, not a black rectangle. The
        // first cut darkened the whole cell and printed as a hole punched in
        // the picture; what actually reads is that the haze and the
        // condensation stop, the vegetation behind comes through cleaner, and
        // the light catches the broken edge where the glass used to be.
        col = mix(col, gbase * 0.45, gone * paneIn * 0.26 * uFieldAmt);
        float pedge = max(smoothstep(0.30, 0.47, abs(fract(vx) - 0.5)),
                          smoothstep(0.30, 0.47, abs(fract(hyq) - 0.5)));
        col += sky * 0.55 * gone * paneIn * pedge * uFieldAmt;
        // one lit edge along the metal
        col += sky * 0.22 * bars * smoothstep(0.45, 0.9, grime) * uFieldAmt;
        // condensation, and the runs it makes down the glass \u2014 a vertical
        // streak is the only thing here that says the water is moving
        float cond = fbm(vec2(uv.x * uAspect * 11.0, uv.y * 11.0) + uSeed * 3.7, 3);
        float runs = fbm(vec2(uv.x * uAspect * 34.0, uv.y * 2.2) + uSeed * 5.1, 3);
        col += sky * 0.20 * smoothstep(0.56, 0.86, cond)
          * (1.0 - bars) * (1.0 - gone) * uFieldAmt;
        col += sky * 0.26 * smoothstep(0.60, 0.80, runs)
          * (1.0 - bars) * (1.0 - gone) * (0.3 + 0.7 * pg) * uFieldAmt;
        col = max(col, vec3(0.0));
      } else if (uField < 18.5) {
        // Clouds. A cumulus is not a blob of noise: it has a FLAT BOTTOM, at
        // the height where the air stops being warm enough to hold the water,
        // and every one in a deck has it at the same height. That single line is
        // the difference between cloud and fog, and it is the only part of this
        // that is drawn rather than sampled. The lit top comes from comparing
        // the noise with itself a little way up \u2014 where the mass is ending
        // upward it is facing the sky, and that is where the light is.
        float yy = uv.y;
        vec3 sky = uFieldCol * 7.0 + uFieldCol2 * 5.0;
        col += sky * (0.20 + 0.90 * smoothstep(-0.1, 1.0, yy)) * uFieldAmt;
        for (int i = 2; i >= 0; i--) {
          float fi = float(i);
          float sc = i == 0 ? 2.4 : (i == 1 ? 4.4 : 7.6);
          float base = i == 0 ? 0.30 : (i == 1 ? 0.50 : 0.66);
          vec2 q = vec2(uv.x * uAspect * sc, yy * sc * 2.2) + uSeed * 0.3 + fi * 7.0
            + vec2(uTime * (0.016 + fi * 0.006), 0.0);
          float n = fbm(q, 5);
          float nUp = fbm(q + vec2(0.0, 0.42), 5);
          float thr = 0.47 + fi * 0.02;
          float body = smoothstep(thr, thr + 0.09, n);
          // the condensation level: a hard edge underneath, soft everywhere else
          body *= smoothstep(base - 0.010, base + 0.028, yy);
          body *= 1.0 - smoothstep(base + 0.36 + fi * 0.08, base + 0.56 + fi * 0.08, yy);
          float rim = clamp((n - nUp) * 5.0, 0.0, 1.0);
          float haze = 0.32 * fi;                     // the far decks lose contrast
          // A cloud has TWO colours and the first cut had neither: the body was
          // mixed toward something a few per cent from the ground it was drawn
          // on, which is a no-op with extra steps. The shadowed underside is a
          // real dark and the sunlit top is a real light, and the distance
          // between them is the whole of what makes it look solid.
          vec3 shade = mix(gbase * 0.42, col, haze * 0.7);
          vec3 lit = mix(sky * 2.0 + gbase * 1.2, col + sky * 0.5, haze * 0.6);
          col = mix(col, mix(shade, lit, rim),
            body * (0.88 - fi * 0.16) * uFieldAmt);
        }
        col = max(col, vec3(0.0));
      } else if (uField < 19.5) {
        // Graveyard. Rows of stones running back, and what makes them stones
        // rather than posts is the ROUNDED SHOULDER: a slab with a semicircular
        // top, which is the one silhouette nothing else in this piece has. They
        // lean, because the ground under a grave settles unevenly and a row of
        // upright markers reads as a fence; and the rows recede by getting
        // shorter and standing higher, which is the whole of the perspective.
        float yy = uv.y;
        vec3 sky = uFieldCol * 6.0 + uFieldCol2 * 4.5;
        col += sky * (0.20 + 0.80 * smoothstep(0.0, 0.85, yy))
          * (0.6 + 0.6 * fbm(vec2(uv.x * uAspect * 2.0, yy * 2.0) + uSeed, 3)) * uFieldAmt;
        for (int i = 2; i >= 0; i--) {
          float fi = float(i);
          float freq = i == 0 ? 5.5 : (i == 1 ? 10.0 : 17.0);
          float baseY = i == 0 ? 0.09 : (i == 1 ? 0.19 : 0.27);
          float hgt = i == 0 ? 0.185 : (i == 1 ? 0.115 : 0.070);
          float xq = uv.x * uAspect * freq + uSeed * 0.5 + fi * 9.0;
          float cx3 = floor(xq), fx = fract(xq);
          float present = step(0.26, hash(vec2(cx3, fi)));
          // Wide. At a sixth of a cell the stones printed as bars and the
          // semicircular cap was too small a fraction of the height to read \u2014
          // and the cap is the entire silhouette. A headstone is about half as
          // wide as it is tall.
          float hw2 = (i == 0 ? 0.26 : (i == 1 ? 0.22 : 0.18))
            * (0.75 + 0.6 * hash(vec2(cx3, fi + 5.0)));
          float h = hgt * (0.55 + 0.85 * hash(vec2(cx3, fi + 3.0)));
          float ty = yy - baseY;
          float tyc = ty * freq;                     // into the cell's own units
          float hc = h * freq;
          float lean = (hash(vec2(cx3, fi + 11.0)) - 0.5) * 0.55;
          float axis = 0.5 + (hash(vec2(cx3, fi + 7.0)) - 0.5) * 0.36
            + lean * max(tyc, 0.0) * 0.16;
          float sx2 = fx - axis;
          // the slab, and the semicircular cap that turns it into a headstone
          float shaftM = step(0.0, tyc)
            * (1.0 - smoothstep(hw2, hw2 + 0.014, abs(sx2)))
            * (1.0 - smoothstep(hc - hw2, hc - hw2 + 0.008, tyc));
          float capM = 1.0 - smoothstep(hw2, hw2 + 0.014,
            length(vec2(sx2, max(0.0, tyc - (hc - hw2)))));
          capM *= step(0.0, tyc);
          // ...and one in five is an obelisk instead: the same slab tapering to
          // a point, which is the other marker anyone would recognise and the
          // only one that breaks the row's flat top line.
          float isO = step(0.80, hash(vec2(cx3, fi + 17.0)));
          float taper = mix(1.0, clamp(1.0 - tyc / max(hc, 1e-4), 0.0, 1.0) * 1.15, isO);
          shaftM = step(0.0, tyc)
            * (1.0 - smoothstep(hw2 * taper, hw2 * taper + 0.014, abs(sx2)))
            * (1.0 - smoothstep(hc - hw2 * (1.0 - isO), hc - hw2 * (1.0 - isO) + 0.008, tyc));
          capM *= 1.0 - isO;
          // one in seven is a cross instead
          float isX = step(0.86, hash(vec2(cx3, fi + 13.0)));
          float armY = hc * 0.72;
          float crossM = step(0.0, tyc)
            * max((1.0 - smoothstep(hw2 * 0.34, hw2 * 0.34 + 0.010, abs(sx2)))
                    * (1.0 - smoothstep(hc, hc + 0.008, tyc)),
                  (1.0 - smoothstep(hw2 * 1.05, hw2 * 1.05 + 0.010, abs(sx2)))
                    * (1.0 - smoothstep(hw2 * 0.30, hw2 * 0.30 + 0.010, abs(tyc - armY))));
          float m = mix(max(shaftM, capM), crossM, isX) * present;
          // a lit face on the key side, so a stone is a solid and not a hole
          float lam = clamp(0.5 - (sx2 / max(hw2, 1e-4))
            * (uKeyXY.x >= 0.0 ? 1.0 : -1.0) * 0.5, 0.0, 1.0);
          vec3 tcol = mix(gbase * 0.26, col + sky * 0.16 * uFieldAmt, fi * 0.32);
          col = mix(col, tcol, clamp(m * (1.0 - 0.40 * pow(lam, 2.2)), 0.0, 1.0)
            * (0.94 - fi * 0.14) * uFieldAmt);
          // moss climbing the foot of it, which is the only thing that says the
          // stone has been standing there rather than been put there
          float moss = m * (1.0 - smoothstep(0.0, hc * 0.42, tyc))
            * smoothstep(0.42, 0.66, fbm(vec2(fx * 9.0 + cx3, tyc * 5.0), 3));
          col = mix(col, gbase * 0.14, moss * 0.55 * uFieldAmt);
        }
        // One bare tree. It is worth more than any number of extra stones: a
        // graveyard is read from its silhouette, and the silhouette everyone
        // already has in mind has a leafless tree in it. Trunk plus seven limbs
        // plus one fork on each \u2014 enough branching to stop reading as a fork in
        // a road, few enough to stay a shape rather than a texture.
        vec2 gp2 = vec2((uv.x - 0.5) * uAspect, yy);
        float txc = (hash(vec2(uSeed * 0.07, 71.0)) - 0.5) * uAspect * 0.86;
        vec2 root = vec2(txc, 0.05);
        vec2 crown = root + vec2(0.03, 0.46);
        float tree = 1.0 - smoothstep(0.011, 0.020, seg(gp2, root, crown));
        for (int i = 0; i < 7; i++) {
          float fi2 = float(i);
          float hh2 = 0.17 + 0.27 * hash(vec2(uSeed * 0.07 + fi2, 5.0));
          vec2 a2 = mix(root, crown, hh2 / 0.46);
          float an = (hash(vec2(uSeed * 0.07 + fi2, 9.0)) - 0.5) * 2.3;
          float ln = 0.09 + 0.15 * hash(vec2(uSeed * 0.07 + fi2, 13.0));
          vec2 b2 = a2 + vec2(sin(an) * ln, abs(cos(an)) * ln * 0.85);
          tree = max(tree, 1.0 - smoothstep(0.0045, 0.0105, seg(gp2, a2, b2)));
          vec2 c3 = b2 + vec2(sin(an * 1.9) * ln * 0.62, abs(cos(an * 1.9)) * ln * 0.5);
          tree = max(tree, 1.0 - smoothstep(0.0022, 0.0068, seg(gp2, b2, c3)));
        }
        col = mix(col, gbase * 0.12, tree * 0.9 * uFieldAmt);
        // the ground they are standing in, and the mist over it \u2014 the only two
        // horizontal things here, and without the first the stones are floating
        col = mix(col, gbase * 0.62,
          (1.0 - smoothstep(0.26, 0.34, yy)) * 0.34 * uFieldAmt);
        col += (uFieldCol2 * 3.4 + uFieldCol * 1.8)
          * pow(1.0 - smoothstep(0.0, 0.26, yy), 1.5) * uFieldAmt;
        col = max(col, vec3(0.0));
      } else if (uField < 20.5) {
        // Landfill. A heap, and then the heap made of THINGS: the silhouette is
        // a couple of overlapping mounds with a ragged crest, and the surface is
        // a field of small angular pieces at random rotations and random
        // lightnesses. Both halves are needed \u2014 a smooth mound is a hill, and
        // the angular fill without a mound is a texture. What says rubbish is
        // that no two neighbouring pieces agree about anything.
        float yy = uv.y;
        vec3 sky = uFieldCol * 6.5 + uFieldCol2 * 4.5;
        col += sky * (0.24 + 0.86 * smoothstep(0.0, 0.9, yy)) * uFieldAmt;
        float mound = 0.0;
        for (int i = 0; i < 3; i++) {
          float fi = float(i);
          float mx2 = (hash(vec2(uSeed * 0.11 + fi, 1.0)) - 0.5) * 0.95;
          float mw = 0.42 + hash(vec2(uSeed * 0.11 + fi, 2.0)) * 0.50;
          float mh = 0.22 + hash(vec2(uSeed * 0.11 + fi, 3.0)) * 0.26;
          float dx = ((uv.x - 0.5) * uAspect - mx2) / max(mw, 1e-3);
          mound = max(mound, mh * exp(-dx * dx * 2.0));
        }
        mound += (fbm(vec2(uv.x * uAspect * 7.0, 3.1) + uSeed, 4) - 0.5) * 0.12;
        float heap = 1.0 - smoothstep(mound - 0.005, mound + 0.005, yy);
        // the pieces
        // The cells are JITTERED off their lattice. A rotation per cell varies
        // the pieces and still leaves them on a grid, and a grid of differently
        // angled things is a mosaic \u2014 the eye finds the lattice before it finds
        // the rubbish. Displacing each piece within its own cell is what breaks
        // it, and costs one hash.
        vec2 jq = vec2(uv.x * uAspect, yy) * 24.0;
        vec2 jc = floor(jq);
        vec2 jf = fract(jq) - 0.5
          - (vec2(hash(jc + 9.4), hash(jc + 11.8)) - 0.5) * 0.55;
        float rot = hash(jc + 0.7) * 6.2831;
        vec2 pr = vec2(jf.x * cos(rot) - jf.y * sin(rot),
                       jf.x * sin(rot) + jf.y * cos(rot));
        vec2 hs = vec2(0.16 + hash(jc + 1.3) * 0.26, 0.12 + hash(jc + 2.9) * 0.24);
        float box = max(abs(pr.x) - hs.x, abs(pr.y) - hs.y);
        float piece = 1.0 - smoothstep(0.0, 0.028, box);
        float seam = 1.0 - smoothstep(0.004, 0.026, abs(box));
        float tone = hash(jc + 5.1);
        // A second, finer grid over the first. One cell size is a tiling and
        // reads as a QR code; two, at an incommensurate scale, read as a heap of
        // things of different sizes, which is what rubbish is.
        vec2 kq = vec2(uv.x * uAspect, yy) * 53.0 + 3.7;
        vec2 kc = floor(kq);
        vec2 kf = fract(kq) - 0.5
          - (vec2(hash(kc + 13.2), hash(kc + 17.6)) - 0.5) * 0.5;
        float rot2 = hash(kc + 2.1) * 6.2831;
        vec2 pr2 = vec2(kf.x * cos(rot2) - kf.y * sin(rot2),
                        kf.x * sin(rot2) + kf.y * cos(rot2));
        vec2 hs2 = vec2(0.13 + hash(kc + 4.7) * 0.22, 0.10 + hash(kc + 6.1) * 0.20);
        float box2 = max(abs(pr2.x) - hs2.x, abs(pr2.y) - hs2.y);
        float piece2 = 1.0 - smoothstep(0.0, 0.05, box2);
        float tone2 = hash(kc + 8.3);
        col = mix(col, gbase * 0.30, heap * 0.92 * uFieldAmt);
        col += sky * (0.14 + 0.62 * tone * tone) * piece * heap * uFieldAmt;
        col += sky * (0.08 + 0.34 * tone2) * piece2 * heap * 0.7 * uFieldAmt;
        col = mix(col, gbase * 0.10, seam * heap * 0.45 * uFieldAmt);
        // Things sticking OUT of it. A heap with a smooth crest is a slag pile;
        // what makes it rubbish is that some of it did not settle \u2014 a few poles
        // and pipes at every angle, breaking the silhouette, which is the same
        // job the tusks do on a mouth.
        float poles = 0.0;
        vec2 gq2 = vec2((uv.x - 0.5) * uAspect, yy);
        for (int i = 0; i < 6; i++) {
          float fi2 = float(i);
          float px2 = (hash(vec2(uSeed * 0.19 + fi2, 21.0)) - 0.5) * uAspect * 0.95;
          float py2 = mound * (0.45 + 0.5 * hash(vec2(uSeed * 0.19 + fi2, 23.0)));
          float an = (hash(vec2(uSeed * 0.19 + fi2, 27.0)) - 0.5) * 2.4;
          float ln = 0.10 + 0.16 * hash(vec2(uSeed * 0.19 + fi2, 29.0));
          vec2 a2 = vec2(px2, py2);
          vec2 b2 = a2 + vec2(sin(an) * ln, abs(cos(an)) * ln);
          poles = max(poles, 1.0 - smoothstep(0.0035, 0.0085, seg(gq2, a2, b2)));
        }
        col = mix(col, gbase * 0.12, poles * 0.9 * uFieldAmt);
        // and the haze standing over it
        col += (uFieldCol2 * 2.4 + uFieldCol * 1.4)
          * exp(-pow((yy - mound) / 0.16, 2.0)) * uFieldAmt;
        col = max(col, vec3(0.0));
      } else if (uField < 21.5) {
        // Tempest. A storm at sea, and the two details that carry it are both
        // about SHEAR. Storm cloud is not cumulus: a cumulus builds upward and a
        // squall line is dragged flat by the wind, so the noise is stretched
        // horizontally and the whole bank leans. And the horizon of a rough sea
        // is not a ruled line \u2014 it is broken by the swell standing in front of
        // it, which is the one thing that separates a seascape from a gradient
        // with a line across it.
        float yy = uv.y;
        vec3 sky = uFieldCol * 6.5 + uFieldCol2 * 4.5;
        float hzn = 0.44 + (fbm(vec2(uv.x * uAspect * 2.4, 7.0) + uSeed, 3) - 0.5) * 0.035;
        float above = smoothstep(hzn - 0.008, hzn + 0.05, yy);
        // one break in the cloud, where the light gets through \u2014 a storm with no
        // break in it is a grey rectangle
        float bx3 = 0.30 + 0.40 * hash(vec2(uSeed * 0.13, 3.0));
        float brk = exp(-pow(((uv.x - bx3) * uAspect) / 0.24, 2.0))
          * smoothstep(hzn, hzn + 0.34, yy);
        col += sky * (0.20 + 1.7 * brk) * above * uFieldAmt;
        float st1 = fbm(vec2(uv.x * uAspect * 1.6 + (yy - hzn) * 1.1 + uTime * 0.05,
          (yy - hzn) * 7.0) + uSeed * 0.4, 5);
        float st2 = fbm(vec2(uv.x * uAspect * 4.2 + (yy - hzn) * 2.0 + uTime * 0.08,
          (yy - hzn) * 15.0) + uSeed * 1.9, 4);
        float cloud = clamp(smoothstep(0.44, 0.66, st1) * 0.95
          + smoothstep(0.54, 0.74, st2) * 0.5, 0.0, 1.0) * above;
        col = mix(col, gbase * 0.28, cloud * (1.0 - brk * 0.75) * 0.88 * uFieldAmt);
        // The sea, and the HORIZON, which the first two cuts did not have.
        //
        // A seascape is not a tonal split with texture underneath it: the thing
        // that makes it read is a hard line where the water ends, with the sky
        // lighter above it and the water plainly darker below. Without that
        // division the swell lines look like ruled lines on a sheet.
        float below = 1.0 - above;
        col = mix(col, gbase * 0.26, below * 0.92 * uFieldAmt);
        col += sky * 1.1 * below
          * pow(1.0 - smoothstep(0.0, 0.10, hzn - yy), 2.2) * uFieldAmt;
        // the light lying along the horizon itself
        col += sky * 1.3 * exp(-pow((yy - hzn) / 0.012, 2.0)) * uFieldAmt;
        // Swells, their spacing compressing toward the horizon.
        //
        // The first cut varied the noise FREQUENCY with distance and beat it
        // against a banding function, which is a moir\xE9 generator: it printed a
        // slanted lattice, and a lattice is the one thing water never does. The
        // fix is to leave the bands alone and displace the DISTANCE instead \u2014 a
        // swell is a horizontal line pushed up and down, not a line whose
        // wavelength changes along its length.
        float dd0 = max(hzn - yy, 0.0);
        float wobY = (fbm(vec2(uv.x * uAspect * 3.2, 11.0) + uSeed, 3) - 0.5) * 0.055
          + (fbm(vec2(uv.x * uAspect * 8.5, 23.0) + uSeed * 1.4, 3) - 0.5) * 0.020;
        float dd = max(dd0 + wobY * smoothstep(0.0, 0.22, dd0), 0.0);
        float rq = pow(dd, 0.62) * 12.0;
        float ph3 = fract(rq);
        // the lit top edge of each swell, and the shadow in the trough behind it
        float crestL = (1.0 - smoothstep(0.0, 0.20, ph3)) * below;
        float trough = smoothstep(0.28, 0.78, ph3) * below;
        col = mix(col, gbase * 0.14, trough * 0.40 * uFieldAmt);
        // Weighted the same all the way up. Fading the crests toward the horizon
        // seemed like aerial perspective and was simply the swell disappearing:
        // the rows already crowd together up there, which is all the distance a
        // sea needs to show.
        col += sky * 0.95 * crestL * (0.72 + 0.5 * smoothstep(0.0, 0.24, dd0))
          * uFieldAmt;
        // and only SOME of them are breaking \u2014 white water on every crest is
        // surf, and surf everywhere at once is a striped blanket
        float brkNoise = fbm(vec2(uv.x * uAspect * 2.6, floor(rq) * 2.7 + uSeed), 3);
        float crest = crestL * smoothstep(0.50, 0.70, brkNoise);
        col += sky * 1.5 * crest
          * (0.30 + 0.95 * smoothstep(0.02, 0.30, dd0)) * uFieldAmt;
        // spindrift, torn off the crests and carried above the horizon
        float sp = hash(vec2(floor(uv.x * uAspect * 190.0), floor(yy * 190.0)) + uSeed);
        col += sky * 1.5 * step(0.9915, sp)
          * smoothstep(hzn - 0.10, hzn - 0.01, yy)
          * (1.0 - smoothstep(hzn + 0.02, hzn + 0.16, yy)) * uFieldAmt;
        col = max(col, vec3(0.0));
      } else if (uField < 22.5) {
        // Breakers. Close to, and the difference from Tempest is scale: that one
        // is a sea seen from a shore, this is three or four waves filling the
        // frame. The crest is a sum of two sines at different frequencies,
        // because a single sine is a ripple and it is the BEAT between two that
        // makes a swell. The barrel at the end is the one shape that says wave
        // rather than water: a dark eye with a lit lip is a tube seen down its
        // length, and nothing else in nature looks like it.
        float yy = uv.y;
        vec3 sky = uFieldCol * 7.0 + uFieldCol2 * 5.0;
        float x2 = (uv.x - 0.5) * uAspect;
        col += sky * (0.20 + 0.95 * smoothstep(0.0, 1.0, yy)) * uFieldAmt;
        // Five ranks, not three. Three smooth arcs across a frame are dunes;
        // what makes a set of waves read is that there are more of them than you
        // can count and they crowd together going away from you.
        for (int i = 4; i >= 0; i--) {
          float fi = float(i);
          float base = 0.13 + fi * 0.115;
          float amp = (0.075 - fi * 0.010) * 1.25;
          float f2 = 2.0 + fi * 1.5;
          float ph4 = uSeed * 0.3 + fi * 5.0 + uTime * (0.24 - fi * 0.02);
          // three harmonics, not two: a swell has a long period, a chop on top
          // of it, and a jitter on top of that, and dropping any one of them
          // gives back a curve that looks drawn rather than blown
          float crest = base + amp * sin(x2 * f2 + ph4)
            + amp * 0.55 * sin(x2 * f2 * 2.3 + ph4 * 1.7)
            + amp * 0.26 * sin(x2 * f2 * 5.1 + ph4 * 2.9)
            + (fbm(vec2(x2 * 4.0 + fi * 4.0, 2.0) + uSeed, 3) - 0.5) * 0.055;
          float body = 1.0 - smoothstep(crest - 0.004, crest + 0.004, yy);
          // The body has to be DARK, and the first cut mixed it a third of the
          // way toward the ground it was already sitting on. Water seen against
          // the sky is nearly black whatever colour it is; the whole picture of
          // a wave is that black shape with a white line on top of it.
          float haze = fi * 0.19;
          col = mix(col, mix(gbase * 0.10, col + sky * 0.10 * uFieldAmt, haze),
            body * (0.97 - fi * 0.07) * uFieldAmt);
          // foam: a hard lit line at the crest, then a torn band under it
          float lip = step(yy, crest)
            * (1.0 - smoothstep(0.0, 0.009 - fi * 0.0013, crest - yy));
          float fo = step(yy, crest)
            * (1.0 - smoothstep(0.0, 0.050 - fi * 0.008, crest - yy));
          float fr = fbm(vec2(x2 * 30.0, (crest - yy) * 18.0) + uSeed * 2.0, 3);
          col += sky * (2.4 - fi * 0.36) * lip * uFieldAmt;
          col += sky * (1.6 - fi * 0.26) * fo * smoothstep(0.38, 0.62, fr) * uFieldAmt;
          // ...and the foam that has run down the face and not yet gone
          if (i == 0) {
            float streak = fbm(vec2(x2 * 26.0, (crest - yy) * 3.0) + uSeed * 3.3, 3);
            col += sky * 0.95 * body * smoothstep(0.56, 0.74, streak)
              * (1.0 - smoothstep(0.0, 0.20, crest - yy)) * uFieldAmt;
          }
        }
        // The barrel, and it has to sit ON a crest. Floating in the middle of
        // the frame it was a grey ring in fog: a tube is only a tube when the
        // wave it belongs to is wrapped over the top of it.
        float bxx = (hash(vec2(uSeed * 0.29, 41.0)) - 0.5) * uAspect * 0.66;
        float bcy = 0.13 + 0.094 * sin(bxx * 2.0 + uSeed * 0.3)
          + 0.052 * sin(bxx * 4.6 + uSeed * 0.51) - 0.052;
        vec2 bq = vec2((x2 - bxx) / 0.15, (yy - bcy) / 0.075);
        float brr = length(bq);
        float tube = 1.0 - smoothstep(0.90, 1.04, brr);
        col = mix(col, gbase * 0.10,
          tube * (1.0 - smoothstep(0.10, 0.70, brr)) * 0.95 * uFieldAmt);
        col += sky * 2.1 * tube * smoothstep(0.66, 0.94, brr) * uFieldAmt;
        col = max(col, vec3(0.0));
      } else if (uField < 23.5) {
        // Reeds by a river. The whole thing is the SPLAY: reeds grow in clumps
        // and fan out from a common root, and a rank of parallel stems is a
        // fence \u2014 the same failure the forest had, arriving in a thinner form.
        // So the lean of each blade is set by where it sits within its clump and
        // grows with height, and the clumps have gaps between them.

            // rooted stem actually moves
            float swPh = hash(vec2(bc, fr2 + 8.0)) * 6.283;

              - sin(swPh)) * 0.22;

              * (1.0 - smoothstep(0.72, 1.0, length(vec2((bxr - axis) / 0.30,

      } else {

        // three things that make it a living city rather than a dead one are all

        // the orange wash a city throws up into it, and the tallest masts have a
        // red lamp on them. Setbacks matter too \u2014 a tower that steps in near the
        // top is the silhouette everyone has seen, and a row of plain boxes is a

        float yy = uv.y;

            + uSeed * 0.4 + fi * 13.0;

            + hash(vec2(cx3, fi + 7.0)) * 0.32;

            * (1.0 - smoothstep(top, top + 0.004, yy));

            * (1.0 - smoothstep(0.008, 0.017, abs(fx - 0.5 - off)))
            * step(top, yy) * (1.0 - smoothstep(top + 0.095, top + 0.115, yy));

  // A light source you can actually see.
  //
  // Every version of this piece has been lit by a rig that was nowhere \u2014 the key
  // had a direction and a colour but no origin, so the modelling on the head was
  // asserting a light the picture never showed. A luminary is drawn into the
  // ground, which means the growth composites over it and occludes it, and it is
  // placed along the same key vector that lights the mass and darkens its lost
  // side. That is the whole reason it does not read as a sticker: the shadow on
  // the creature already agreed with it before it was there.

    col = mix(col, vec3(lN) * vec3(0.55, 0.42, 0.78), 0.6) * 0.34;
  }

      // horizontal smear a bright source leaves across a lens. The smear is what
      // separates a sun from a white circle: a disc alone reads as a hole cut in
      // the ground, and the streak is the only part of it that says the light is
      // in front of something rather than behind it.

      // of frame or behind mist actually looks like

      // "core". The core term is allowed to run past white because a sun's disc
      // is a couple of per cent of the frame \u2014 but a window is an upright
      // RECTANGLE two and a half times taller than it is wide, several times
      // that area, and it was being driven at the same amplitude. It is not a
      // disc and it does not get a disc's licence.

      // the one luminary that composes WITH the silhouette rather than beside it.
      // The ring goes on the SATURATING term, not the core one. The split
      // between them is about area, not about brightness: a core is allowed to
      // run past white because it is a few per cent of the frame, and this ring
      // is a band a fifth of the frame across. Driven on the core term it did
      // exactly what the halo used to do and washed out everything inside it.

    // for the seeds where the light ate half the picture.

    // past white is exactly right: that is what blooms, and a source that does
    // not blow out is not a source. The halo is the opposite: it covers a third
    // of the sheet, so every unit of it is a third of the picture going pale,
    // and at the amplitudes that made the disc look good it was flattening
    // everything around the creature into paper. So the halo SATURATES \u2014 an

    // however hard it is driven. The disc stays as hot as it likes and the field
    // behind the creature keeps its tone.

  //

  // faint modulation of the marks; the ground itself was always smooth. This is

      tx = -edge * 1.4 + 0.12;

      // Rotated, because an unrotated screen aligns with the pixel grid and
      // moires with itself.
      float ca = 0.9239, sa = 0.3827;
      vec2 rp = vec2(tp.x * ca - tp.y * sa, tp.x * sa + tp.y * ca) * 150.0;
      vec2 cell = fract(rp) - 0.5;
      tx = (0.5 - smoothstep(0.16, 0.34, length(cell))) * 1.3;
    } else {
      // silk: broad soft bands with a fine sheen across them, which is what a
      // woven ground does under a raking light
      float band = sin(tp.y * 26.0 + fbm(tp * 2.2, 3) * 6.0) * 0.5 + 0.5;
      float sheen = sin((tp.x * 0.6 + tp.y) * 320.0) * 0.5 + 0.5;

    // Multiplicative alone was the wrong formulation, and it failed in exactly
    // the place this piece lives: on a ground that is nearly black, a percentage
    // of nearly nothing is nothing, so the weave was invisible on three quarters
    // of the edition and only showed on paper. The modulation now rides on a
    // floor made from the ramp's lighter end, so a dark ground gets a real
    // texture ADDED and a pale one still gets its multiplicative shading \u2014 one
    // expression, correct at both ends of the value range.
    col += (col * 0.75 + uGroundB * 1.1 + 0.006) * tx * uTexAmt * 2.4;

  col = max(col, vec3(0.0));

  // TWO-SPEED RECESSION. One repaint rate cannot serve two masters: 0.0055 a
  // frame preserves the creature's trails and is a three-second low-pass that
  // ATE the field motion \u2014 measured twice, felt by nobody. So in endless the
  // repaint is spatially split: background pixels take a fast repaint (crisp
  // motion, ~0.3s persistence) while the creature's region keeps the slow one.
  //
  // The mask is GEOMETRIC \u2014 the creature's own bounds ellipse \u2014 and not the
  // density buffer, because the first cut used density and the weather marks
  // write density too: the falling rain flagged the whole sky as creature and
  // put itself back in the slow lane. Measured: no change at all. The sentinel
  // keeps every non-endless render bit-exact.
  float alphaOut = uAlpha;
  if (uAlphaBg >= 0.0) {
    vec2 pe = (vUv - uProt.xy) / max(uProt.zw, vec2(1e-4));
    alphaOut = mix(uAlphaBg, uAlpha, 1.0 - smoothstep(0.8, 1.15, length(pe)));
  }
  fragColor = vec4(col, alphaOut);
}
